[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "brickbot"
version = "0.2.1"
readme = "README.md"
license = "MIT"
description = "Geometry-derived LDraw rectangular brick assembly engine"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "trimesh>=4", "shapely>=2", "networkx>=3", "scipy>=1"]
[project.scripts]
brickbot = "brick_engine.cli:main"
brick-engine = "brick_engine.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
brick_engine = ["data/*.json", "data/meshes/*.json.gz", "data/ldraw/**/*", "data/ldraw/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
